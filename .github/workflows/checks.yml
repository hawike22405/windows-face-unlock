name: Regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pywin32 numpy opencv-python
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q face_service presence_monitor installer tests
      - name: Compile Credential Provider
        run: |
          cmake -S credential_provider -B credential_provider/build -A x64
          cmake --build credential_provider/build --config Release
